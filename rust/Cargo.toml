[package]
name = "resilience-rust"
version = "0.1.0"
edition = "2021"

[dependencies]
tonic = "0.12"
tokio = { version = "1", features = ["full"] }
prost = "0.13"
clap = { version = "4", features = ["derive"] }
time = { version = "0.3", features = ["local-offset", "formatting", "macros"] }

[build-dependencies]
tonic-build = "0.12"

[[bin]]
name = "server"
path = "src/bin/server.rs"

[[bin]]
name = "client"
path = "src/bin/client.rs"
